<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Six Double - 9x6 Grid Edition</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #gameContainer {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            background: #34495e;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>The Six Doubles</h1>
<div id="gameContainer">
    <canvas id="gameCanvas" width="920" height="660"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- WEB AUDIO API SOUND SYSTEM ---
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playRollClickSound() {
    try {
        const c = getAudioContext();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150 + Math.random() * 350, c.currentTime);
        gain.gain.setValueAtTime(0.04, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.03);
    } catch(e) {}
}

function playFirstDoubleSound() {
    try {
        const c = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, c.currentTime + i * 0.07);
            gain.gain.setValueAtTime(0.15, c.currentTime + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i * 0.07 + 0.22);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(c.currentTime + i * 0.07);
            osc.stop(c.currentTime + i * 0.07 + 0.22);
        });
    } catch(e) {}
}

function playRepeatDoubleSound() {
    try {
        const c = getAudioContext();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, c.currentTime + 0.35);
        gain.gain.setValueAtTime(0.18, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.35);
    } catch(e) {}
}

function playVictorySound() {
    try {
        const c = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50]; // C5, E5, G5, B5, C6
        notes.forEach((freq, i) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            const startTime = c.currentTime + i * 0.12;
            const duration = i === notes.length - 1 ? 0.6 : 0.15;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        });
    } catch(e) {}
}

function playGameOverSound() {
    try {
        const c = getAudioContext();
        const notes = [311.13, 293.66, 277.18, 261.63]; // Eb4, D4, Db4, C4
        notes.forEach((freq, i) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sawtooth';
            const startTime = c.currentTime + i * 0.15;
            const duration = i === notes.length - 1 ? 0.6 : 0.18;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        });
    } catch(e) {}
}

// --- GAME STATE ---
let gameStarted = false;
let firstTurnOfRound = true; 
let rollCount = 0; 
let flags = [false, false, false, false, false, false];
let credits = [6, 6, 6, 6, 6, 6]; 
const STARTING_CREDITS = 6;

let leftDie = 1;  // 1 to 6
let rightDie = 1; // 1 to 6

let leftMarkerPos = 0; 
let rightMarkerPos = 0;
let leftDir = 1; 
let rightDir = 1;

let isRolling = false;
let rollTimer = 0;
let rollTarget = 0; 

let message = "Welcome! Click 'New Game' to begin.";
let subMessage = "";

// --- BUTTON LAYOUT ---
const buttons = [
    { id: 1, text: "Both Dice (↑)", x: 700, y: 100, w: 190, h: 45, active: false },
    { id: 2, text: "Left Die (←)",  x: 700, y: 160, w: 190, h: 45, active: false },
    { id: 3, text: "Right Die (→)", x: 700, y: 220, w: 190, h: 45, active: false },
    { id: 4, text: "Pass Turn (↓)",       x: 700, y: 280, w: 190, h: 45, active: false },
    { id: 5, text: "Shuffle (Space)",    x: 700, y: 360, w: 190, h: 45, active: false },
    { id: 6, text: "New Game",      x: 700, y: 520, w: 190, h: 50, active: true }
];

// --- GRID METRICS ---
const GRID_LEFT = 30;
const GRID_TOP = 80;
const COL_WIDTH = 100;
const ROW_HEIGHT = 50;
const COLS = 6;
const ROWS = 9;

draw();

// --- GAME LOGIC ---
function initGame() {
    flags = [false, false, false, false, false, false];
    credits = [STARTING_CREDITS, STARTING_CREDITS, STARTING_CREDITS, STARTING_CREDITS, STARTING_CREDITS, STARTING_CREDITS];
    leftDie = 1; //Math.floor(Math.random() * 6) + 1;
    rightDie = 6; //Math.floor(Math.random() * 6) + 1;
    leftMarkerPos = leftDie - 1;
    rightMarkerPos = rightDie - 1;
    gameStarted = true;
    firstTurnOfRound = true;
    rollCount = 0;
    //message = "New Game Started! Roll Both Dice to begin.";
    //subMessage = "First roll of the round requires playing both dice.";
    updateButtonStates();
    draw();
}

function updateButtonStates() {
    if (!gameStarted) {
        buttons.forEach(b => b.active = (b.id === 6));
        return;
    }

    if (flags.every(f => f)) {
        message = "🎉 VICTORY! You obtained all six doubles!";
        subMessage = "Click 'New Game' to play again.";
        buttons.forEach(b => b.active = (b.id === 6));
        playVictorySound();
        return;
    }
    
    if (credits.some(c => c <= 0)) {
        message = "💥 GAME OVER! One of your credit pools hit 0.";
        subMessage = "Click 'New Game' to try again.";
        buttons.forEach(b => b.active = (b.id === 6));
        playGameOverSound();
        return;
    }

    buttons[0].active = true; 

    if (rollCount === 1) {
        buttons[1].active = true; 
        buttons[2].active = true; 
        buttons[3].active = true; 
    } else {
        buttons[1].active = false;
        buttons[2].active = false;
        buttons[3].active = false;
    }

    buttons[4].active = (rollCount === 0 && firstTurnOfRound);
    buttons[5].active = true;
}

function shuffleCredits() {
    let maxVal = Math.max(...credits);
    let minVal = Math.min(...credits);

    if (maxVal === 0) {
        //message = "Cannot shuffle, no credits available.";
        draw();
        return;
    }

    if (credits.every(c => c === STARTING_CREDITS)) {
        //message = "Credits are balanced at 6. No shuffle needed.";
        draw();
        return;
    }

    let maxIdx = credits.indexOf(maxVal);
    let minIdx = credits.indexOf(minVal);

    credits[maxIdx]--;
    credits[minIdx]++;
    //message = `Shuffled! Shifted 1 credit from Die ${maxIdx + 1} to Die ${minIdx + 1}.`;
    
    draw();
}

function startRoll(type) {
    if (isRolling) return;
    isRolling = true;
    rollTarget = type;
    rollTimer = 0;

    if (type === 1 || type === 2) leftDie = Math.floor(Math.random() * 6) + 1;
    if (type === 1 || type === 3) rightDie = Math.floor(Math.random() * 6) + 1;

    animateRoll();
}

function animateRoll() {
    rollTimer++;

    // Play rolling dice sound
    playRollClickSound();

    const speed = 0.3;
    if (rollTarget === 1 || rollTarget === 2) {
        leftMarkerPos += speed * leftDir;
        if (leftMarkerPos >= 5) { leftMarkerPos = 5; leftDir = -1; }
        if (leftMarkerPos <= 0) { leftMarkerPos = 0; leftDir = 1; }
    }
    if (rollTarget === 1 || rollTarget === 3) {
        rightMarkerPos += speed * rightDir;
        if (rightMarkerPos >= 5) { rightMarkerPos = 5; rightDir = -1; }
        if (rightMarkerPos <= 0) { rightMarkerPos = 0; rightDir = 1; }
    }

    draw();

    if (rollTimer < 35) {
        requestAnimationFrame(animateRoll);
    } else {
        if (rollTarget === 1 || rollTarget === 2) leftMarkerPos = leftDie - 1;
        if (rollTarget === 1 || rollTarget === 3) rightMarkerPos = rightDie - 1;
        
        isRolling = false;
        evaluateRoll();
    }
}

function evaluateRoll() {
    rollCount++;
    firstTurnOfRound = false; 

    if (leftDie === rightDie) {
        let targetIdx = leftDie - 1;
        if (!flags[targetIdx]) {
            flags[targetIdx] = true;
            //message = `🎲 DOUBLE ${leftDie}'s! Double obtained!`;
            //subMessage = "Excellent! A new round begins now.";
            resetRoundState();
            playFirstDoubleSound();
        } else {
            // Repeat double penalty: deduction on this specific double number
            credits[targetIdx] = Math.max(0, credits[targetIdx] - 1);
            //message = `Double ${leftDie}'s rolled, but double was already obtained!`;
            //subMessage = `Lost 1 credit on Number ${leftDie}.`;
            resetRoundState();
            playRepeatDoubleSound();
        }
    } else {
        if (rollCount === 1) {
            //message = `Rolled a ${leftDie} and a ${rightDie}. No double.`;
            //subMessage = "Choose your 2nd Turn action.";
        } else if (rollCount === 2) {
            // Turn 2 Miss: Penalty deduction on BOTH current die numbers
            let idxL = leftDie - 1;
            let idxR = rightDie - 1;
            
            credits[idxL] = Math.max(0, credits[idxL] - 1);
            credits[idxR] = Math.max(0, credits[idxR] - 1);
            
            //message = `No double obtained on the second turn!`;
            //subMessage = `Lost 1 credit on Number ${leftDie} and Number ${rightDie}.`;
            resetRoundState();
        }
    }
    updateButtonStates();
    draw();
}

function passTurn() {
    let idxL = leftDie - 1;
    let idxR = rightDie - 1;
    credits[idxL] = Math.max(0, credits[idxL] - 1);
    credits[idxR] = Math.max(0, credits[idxR] - 1);
    
    //message = `Passed the turn.`;
    //subMessage = `Lost 1 credit on Number ${leftDie} and Number ${rightDie}.`;
    resetRoundState();
    updateButtonStates();
    draw();
}

function resetRoundState() {
    rollCount = 0;
    firstTurnOfRound = true;
}

// --- EVENT LISTENERS ---
canvas.addEventListener('click', function(event) {
    getAudioContext(); // Resume audio context on click
    const rect = canvas.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    const mouseY = event.clientY - rect.top;

    buttons.forEach(b => {
        if (b.active && mouseX >= b.x && mouseX <= b.x + b.w && mouseY >= b.y && mouseY <= b.y + b.h) {
            handleButtonClick(b.id);
        }
    });
});

window.addEventListener('keydown', function(event) {
    getAudioContext(); // Resume audio context on keypress
    
    let buttonIdToTrigger = null;

    switch (event.key) {
        case "ArrowUp":
            buttonIdToTrigger = 1; // Play Both Dice
            break;
        case "ArrowLeft":
            buttonIdToTrigger = 2; // Play Left Die
            break;
        case "ArrowRight":
            buttonIdToTrigger = 3; // Play Right Die
            break;
        case "ArrowDown":
            buttonIdToTrigger = 4; // Pass Turn
            break;
        case " ":
        case "Spacebar":
            buttonIdToTrigger = 5; // Shuffle Credits
            break;
    }

    if (buttonIdToTrigger !== null) {
        event.preventDefault();
        
        const targetBtn = buttons.find(b => b.id === buttonIdToTrigger);
        if (targetBtn && targetBtn.active) {
            handleButtonClick(targetBtn.id);
        }
    }
});

function handleButtonClick(id) {
    if (isRolling) return;
    
    switch(id) {
        case 1: startRoll(1); break; 
        case 2: startRoll(2); break; 
        case 3: startRoll(3); break; 
        case 4: passTurn(); break;
        case 5: shuffleCredits(); break;
        case 6: initGame(); break;
    }
}

// --- DRAWING FUNCTIONS ---
function draw() {
    ctx.fillStyle = "#34495e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Message Header
    ctx.fillStyle = "#ecf0f1";
    ctx.font = "bold 16px 'Segoe UI'";
    ctx.fillText(message, GRID_LEFT, 35);
    ctx.fillStyle = "#bdc3c7";
    ctx.font = "14px 'Segoe UI'";
    ctx.fillText(subMessage, GRID_LEFT, 58);

    // Separator line before buttons
    ctx.strokeStyle = "#2c3e50";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(670, 0);
    ctx.lineTo(670, canvas.height);
    ctx.stroke();

    // Draw 9x6 Grid
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let x = GRID_LEFT + c * COL_WIDTH;
            let y = GRID_TOP + r * ROW_HEIGHT;

            ctx.strokeStyle = "#2c3e50";
            ctx.lineWidth = 2;
            
            if (r === 0) {
                // Row 0: Double status
                ctx.fillStyle = flags[c] ? "#f1c40f" : "#16a085";
            } else if (r >= 1 && r <= 6) {
                // Rows 1 to 6: Credits track (lost credits go UP starting from Row 6)
                if (r <= credits[c]) {
                    ctx.fillStyle = "#e67e22";
                } else {
                    ctx.fillStyle = "#2c3e50";
                }
            } else if (r === 7) {
                // Row 7: Right Die Track
//                ctx.fillStyle = "#8e44ad";
                ctx.fillStyle = "#2980b9";
            } else if (r === 8) {
                // Row 8: Left Die Track
                ctx.fillStyle = "#2980b9";
            }

            ctx.fillRect(x, y, COL_WIDTH - 4, ROW_HEIGHT - 4);
            ctx.strokeRect(x, y, COL_WIDTH - 4, ROW_HEIGHT - 4);
        }
    }

    // Row Labels
//    ctx.fillStyle = "#bdc3c7";
//    ctx.font = "bold 11px 'Segoe UI'";
//    ctx.fillText("ROW 0: DOUBLES STATUS", GRID_LEFT, GRID_TOP - 8);
//    ctx.fillText("ROWS 1-6: CREDITS TRACK (ELIMINATES UPWARDS)", GRID_LEFT + 220, GRID_TOP - 8);
//    ctx.fillText("ROW 7: RIGHT DIE TRACK", GRID_LEFT, GRID_TOP + 7 * ROW_HEIGHT - 6);
//    ctx.fillText("ROW 8: LEFT DIE TRACK", GRID_LEFT, GRID_TOP + 8 * ROW_HEIGHT - 6);

    // Draw Dice Markers (Row 7 = Right Die, Row 8 = Left Die)
    drawMarker(7, rightMarkerPos, "🎲 Right: " + rightDie, "#9b59b6");
    drawMarker(8, leftMarkerPos, "🎲 Left: " + leftDie, "#e74c3c");

    // Draw Buttons
    buttons.forEach(b => drawButton(b));
}

function drawMarker(rowIdx, colPos, text, color) {
    let x = GRID_LEFT + colPos * COL_WIDTH;
    let y = GRID_TOP + rowIdx * ROW_HEIGHT;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x + 4, y + 4, COL_WIDTH - 12, ROW_HEIGHT - 12, 6);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px 'Segoe UI'";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + COL_WIDTH / 2 - 2, y + ROW_HEIGHT / 2 - 2);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
}

function drawButton(b) {
    if (!b.active) {
        ctx.fillStyle = "#7f8c8d";
    } else {
        ctx.fillStyle = b.id === 6 ? "#27ae60" : "#2980b9";
    }
    
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 14px 'Segoe UI'";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.text, b.x + b.w / 2, b.y + b.h / 2);
    
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
}
</script>
</body>
</html>
